name: agenta

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: agenta
      POSTGRES_USER: ${POSTGRES_USER:-agenta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenta}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
